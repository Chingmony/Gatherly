spring:
  application:
    name: gatherly
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://96.9.81.187:5455/gartherly}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate must not touch it
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:96.9.81.187}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: smtp.gmail.com
    port: 587
    username: lenghongmeng.dev@gmail.com
    password: tlzh rgai eszy kqdf
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8082
  address: 0.0.0.0
  # No servlet context-path: the /api/v1 prefix is applied to controllers via WebMvcConfig so that
  # Swagger UI (springdoc, outside the controller package) stays at the root (/swagger-ui/...).

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      # Don't let health polls dial SMTP — a missing mail server must not mark the app DOWN
      # (email is a non-critical after-commit side effect). Enable per-env if you want it monitored.
      enabled: false
    redis:
      # Redis backs OTP + rate limiting (needed only for those flows, not the core loop). Health
      # check off so a not-yet-running local Redis doesn't mark the app DOWN. Re-enable where Redis
      # is a hard runtime dependency you want monitored.
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

# ── Application-level config ──────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:uhrjOspscee8/VcVTf+FoztI8Z6v6p6HCbWUyl6jSeE=}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}       # 15 min
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:604800}  # 7 days

  email:
    enabled: ${EMAIL_ENABLED:true}
    from-address: ${MAIL_FROM_ADDRESS:onboarding@resend.dev}
    from-name: ${MAIL_FROM_NAME:Gatherly}

  telegram:
    enabled: ${TELEGRAM_ENABLED:true}
    bot-token: ${TELEGRAM_BOT_TOKEN:8835580917:AAGLJeYN3Lh-vU9YLxTf8UDsPs7ojonGRiQ}
    ops-chat-id: ${TELEGRAM_OPS_CHAT_ID:924703989}
    api-base: ${TELEGRAM_API_BASE:https://api.telegram.org}

  rustfs:
    endpoint: ${RUSTFS_ENDPOINT:http://rustfs:9000}
    region: ${RUSTFS_REGION:us-east-1}
    access-key: ${RUSTFS_ACCESS_KEY:admin}
    secret-key: ${RUSTFS_SECRET_KEY:admin123}
    bucket: ${RUSTFS_BUCKET:gatherly}
    public-base-url: ${RUSTFS_PUBLIC_BASE_URL:}
    presign-ttl-seconds: ${RUSTFS_PRESIGN_TTL_SECONDS:300}

  otp:
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    length: ${OTP_LENGTH:6}

  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}

  # ShedLock-guarded scheduled jobs (retry sweeps + cleanup). Needs Redis; the local profile
  # disables it so dev without Redis stays quiet.
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}

  # Per-IP rate limiting (Redis, 60s windows, fails open). Disabled where Redis isn't running.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN:10}
    otp-per-minute: ${RATE_LIMIT_OTP:5}
    register-per-minute: ${RATE_LIMIT_REGISTER:20}

  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000,http://192.168.200.119:3000}
