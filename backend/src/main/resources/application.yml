# Base configuration shared by all profiles. Environment-specific overrides live in
# application-{local,prod}.yml. All secrets/URLs come from env (docs/12 §4) — never hard-coded.
spring:
  application:
    name: gatherly
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gatherly}
    username: ${DB_USERNAME:gatherly}
    password: ${DB_PASSWORD:gatherly}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (docs/02 §8); JPA never mutates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # A failed migration halts boot — fail-closed (docs/12 §5).
    baseline-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

  jackson:
    # Jackson 3 (Spring Boot 4) already serializes dates as ISO-8601 by default, so no
    # write-dates-as-timestamps flag is needed (that SerializationFeature was removed in v3).
    default-property-inclusion: non_null

# Health is public; everything else under /actuator is restricted (locked down in M9).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8080
  error:
    # The uniform error contract (docs/07) is produced by our @RestControllerAdvice,
    # not the default whitelabel page.
    whitelabel:
      enabled: false

# Application-scoped settings (bound via @ConfigurationProperties / @Value).
gatherly:
  api-base-path: /api/v1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}     # 15 minutes (docs/03 §2.1)
      refresh-ttl: ${JWT_REFRESH_TTL:P7D}      # 7 days
    cookie:
      secure: ${COOKIE_SECURE:true}            # false only for local http dev
      same-site: ${COOKIE_SAMESITE:Strict}
      domain: ${COOKIE_DOMAIN:}
    otp:                                        # docs/04 §3.2
      ttl-seconds: ${OTP_TTL_SECONDS:300}
      max-attempts: ${OTP_MAX_ATTEMPTS:5}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      length: ${OTP_LENGTH:6}
      grant-ttl-seconds: ${OTP_GRANT_TTL_SECONDS:300}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@gatherly.local}
    from-name: ${MAIL_FROM_NAME:Gatherly}
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      name: ${BOOTSTRAP_ADMIN_NAME:Gatherly Admin}
