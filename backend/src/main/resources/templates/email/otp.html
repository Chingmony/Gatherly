<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password reset code</title>
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a">
    <h2>Gatherly password reset</h2>
    <p>Hi <span th:text="${fullName}">there</span>,</p>
    <p>Use this one-time code to reset your password:</p>
    <p style="font-size: 28px; font-weight: bold; letter-spacing: 4px" th:text="${otp}">000000</p>
    <p>
      This code expires in <span th:text="${ttlMinutes}">5</span> minutes. If you didn't request a
      password reset, you can safely ignore this email.
    </p>
    <hr />
    <p style="font-size: 12px; color: #777">Gatherly — automated message, do not reply.</p>
  </body>
</html>
