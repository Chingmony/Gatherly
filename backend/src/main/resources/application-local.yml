# Local development profile — backing services from docker-compose.yml (docs/12 §3).
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Local dev runs the backend on 9090 (override the 8080 default). `SERVER_PORT` env still wins
# if set — OS env outranks profile yml — which is how the Docker backend is pinned back to 8080
# (docker-compose sets SERVER_PORT=8080 so the port mapping + healthcheck line up).
server:
  port: ${SERVER_PORT:9090}

gatherly:
  auth:
    cookie:
      # Local dev is plain http → cookies can't be Secure or the browser drops them.
      secure: false
  bootstrap:
    # Local-only demo accounts (Sub-admin + Handler) so the role-based UI can be tested without the
    # email-activation flow. NEVER seeded outside the `local` profile. Override the password via env.
    demo-users:
      enabled: ${DEMO_USERS_ENABLED:true}
      password: ${DEMO_USERS_PASSWORD:Demo1234!}

# Degraded-tolerant readiness (docs/08): a down/misconfigured SMTP relay must not make the app
# look unhealthy locally — email delivery is best-effort and async. Keep the mail indicator out of
# the aggregate health used by the container healthcheck.
management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.gatherly: DEBUG
    org.flywaydb: INFO
