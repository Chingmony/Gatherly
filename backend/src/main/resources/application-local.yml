# Local dev overrides.
#
# Mail: by default we use the REAL Gmail SMTP from application.yml so members actually receive the
# welcome / reset emails in their inbox. Real addresses deliver fine; only fake domains (e.g.
# @example.com) produce a bounce-back to the sender — so test with real addresses.
#
# Prefer the local MailHog catcher instead (no real delivery, no bounces, view at
# http://localhost:8025)? Start the app with:  MAIL_HOST=localhost MAIL_PORT=1025 MAIL_SMTP_AUTH=false MAIL_STARTTLS=false
spring:
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

app:
  email:
    # Welcome / OTP / QR-ticket emails. EMAIL_ENABLED=false logs the message instead of sending.
    enabled: ${EMAIL_ENABLED:true}
    # Gmail rewrites From to the authenticated account, so this should match spring.mail.username.
    from-address: ${MAIL_FROM_ADDRESS:gartherlyteam@gmail.com}
    from-name: ${MAIL_FROM_NAME:Gatherly}
  telegram:
    enabled: true
  scheduling:
    enabled: false # no Redis required for ShedLock locally
  rate-limit:
    enabled: false # no Redis required for rate limiting locally
