# Local dev overrides. The Resend SMTP config (host=smtp.resend.com, username=resend, password=API
# key) is inherited from application.yml — do NOT re-declare spring.mail.password here or an empty
# default will shadow the key (535 Missing password).
spring:
  jpa:
    show-sql: true

app:
  email:
    # OTP + QR-ticket emails via the SMTP in application.yml. Set EMAIL_ENABLED=false to log instead.
    enabled: ${EMAIL_ENABLED:true}
    # Gmail rewrites From to the authenticated account, so this must match spring.mail.username.
    from-address: ${MAIL_FROM_ADDRESS:gartherlyteam@gmail.com}
    from-name: ${MAIL_FROM_NAME:Gatherly}
  telegram:
    enabled: true
  scheduling:
    enabled: false # no Redis required for ShedLock locally
  rate-limit:
    enabled: false # no Redis required for rate limiting locally
