<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your QR ticket</title>
  </head>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #1a1a1a">
    <h2>You're registered 🎉</h2>
    <p>Hi <span th:text="${guestName}">guest</span>,</p>
    <p>
      You're registered for <strong th:text="${eventTitle}">Event</strong>
      (<span th:text="${eventWhen}">date</span><span th:if="${venue}">, <span th:text="${venue}">venue</span></span>).
    </p>
    <p>Show this QR at the entrance — an organizer will scan it to confirm your attendance.</p>
    <p><img src="cid:qr" alt="Your QR ticket" width="240" height="240" /></p>
    <p>
      Can't see the image? View your ticket:
      <a th:href="${ticketUrl}" th:text="${ticketUrl}">ticket link</a>
    </p>
    <hr />
    <p style="font-size: 12px; color: #777">Gatherly — automated message, do not reply.</p>
  </body>
</html>
