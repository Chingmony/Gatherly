services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatherly
      POSTGRES_USER: gatherly
      POSTGRES_PASSWORD: gatherly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP sink
      - "8025:8025"   # Web UI — view QR/OTP emails at http://localhost:8025

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gatherly
      MINIO_ROOT_PASSWORD: gatherly123
    ports:
      - "9000:9000"   # S3-compatible API (Rustfs local replacement)
      - "9001:9001"   # MinIO console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/gatherly
      DB_USERNAME: gatherly
      DB_PASSWORD: gatherly
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-only-jwt-secret-min-256-bits-change-before-any-real-deployment
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM_ADDRESS: no-reply@gatherly.local
      MAIL_FROM_NAME: Gatherly
      EMAIL_ENABLED: "true"
      RUSTFS_ENDPOINT: http://minio:9000
      RUSTFS_ACCESS_KEY: gatherly
      RUSTFS_SECRET_KEY: gatherly123
      RUSTFS_BUCKET: gatherly
      RUSTFS_PUBLIC_BASE_URL: http://localhost:9000/gatherly
      TELEGRAM_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_OPS_CHAT_ID: ""
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      APP_PUBLIC_BASE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_RUSTFS_BASE_URL: http://localhost:9000/gatherly
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
