# Gatherly — local development stack (docs/12 §3).
# One command (`docker compose up`) brings up every backing service plus both apps.
# Telegram is disabled locally; QR/OTP emails land in MailHog's web UI.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatherly}
      POSTGRES_USER: ${POSTGRES_USER:-gatherly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatherly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatherly} -d ${POSTGRES_DB:-gatherly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP sink + web UI (http://localhost:8025) for inspecting QR-ticket / OTP emails.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # S3-compatible store standing in for the Rustfs cluster locally.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY:-minioadmin}
      # Allow browser presigned PUTs from the app origin (S3 PutBucketCors isn't supported by MinIO).
      MINIO_API_CORS_ALLOW_ORIGIN: ${RUSTFS_CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      # The `local` profile defaults the app to :9090 (for host bootRun); in the container we pin it
      # back to 8080 so the port mapping + healthcheck below line up. OS env outranks the profile yml.
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gatherly}
      DB_USERNAME: ${POSTGRES_USER:-gatherly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gatherly}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-bytes}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@gatherly.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-on-first-login}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Gatherly Admin}
      # Mail: defaults to the local MailHog sink; override via .env (git-ignored) to use a real
      # relay such as Gmail SMTP (see .env.example). Secrets are never committed.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@gatherly.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Gatherly}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:3000}
      # Storage: presign URL host must be browser-reachable (localhost:9000); the backend reaches
      # MinIO internally at minio:9000 for bucket ops (docs/04 §4.2).
      RUSTFS_ENABLED: ${RUSTFS_ENABLED:-true}
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:-http://localhost:9000}
      RUSTFS_INTERNAL_ENDPOINT: http://minio:9000
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-gatherly}
      RUSTFS_PUBLIC_BASE_URL: ${RUSTFS_PUBLIC_BASE_URL:-http://localhost:9000/gatherly}
      # Telegram ops-channel forwarding (docs/04 §2.2). Disabled by default; set TELEGRAM_ENABLED=true
      # plus the bot token + ops chat id in .env (git-ignored) to push registrations/check-ins.
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OPS_CHAT_ID: ${TELEGRAM_OPS_CHAT_ID:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      INTERNAL_API_BASE_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
