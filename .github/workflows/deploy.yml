# M10 release promotion (docs/12, docs/14). Build immutable images once on a version tag, deploy to
# staging, then promote the SAME images to prod behind a manual approval gate. Infra-specific values
# (registry, hosts, kube context) come from GitHub environment secrets — fill these in per ops setup.
name: Deploy

on:
  push:
    tags: ["v*"]            # e.g. v1.2.0
  workflow_dispatch:        # manual re-run / hotfix promotion

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}   # ghcr.io/<owner>/<repo>-{backend,frontend}

jobs:
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        run: |
          docker build -t $REGISTRY/${IMAGE_PREFIX}-backend:${{ steps.meta.outputs.tag }} ./backend
          docker push $REGISTRY/${IMAGE_PREFIX}-backend:${{ steps.meta.outputs.tag }}
      - name: Build & push frontend
        run: |
          docker build -t $REGISTRY/${IMAGE_PREFIX}-frontend:${{ steps.meta.outputs.tag }} ./frontend
          docker push $REGISTRY/${IMAGE_PREFIX}-frontend:${{ steps.meta.outputs.tag }}

  deploy-staging:
    name: Deploy to staging
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging          # configure protection rules / secrets in GitHub → Environments
    steps:
      - uses: actions/checkout@v4
      # TODO(ops): real deploy step (kubectl/helm/compose over SSH). Flyway runs on app startup;
      # a failed migration halts boot and the rollout, per docs/12 §5 + docs/14 migration runbook.
      - name: Apply staging release
        run: echo "Deploy ${IMAGE_PREFIX}:${{ needs.build-images.outputs.tag }} to staging (fill in ops step)"
      - name: Smoke test (readiness)
        run: echo "curl -f https://staging.gatherly.example/actuator/health/readiness (fill in URL)"

  promote-prod:
    name: Promote to production
    needs: [build-images, deploy-staging]
    runs-on: ubuntu-latest
    environment: production       # add required reviewers here = the manual approval gate (docs/14)
    steps:
      - uses: actions/checkout@v4
      - name: Promote same images to prod
        run: echo "Promote ${IMAGE_PREFIX}:${{ needs.build-images.outputs.tag }} to prod (fill in ops step)"
      - name: Post-deploy smoke test
        run: echo "curl -f https://app.gatherly.example/actuator/health/readiness (fill in URL)"
      # Rollback: re-run this workflow_dispatch with the previous green tag (docs/14 rollback rehearsal).
