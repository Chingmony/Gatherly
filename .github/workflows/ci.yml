# CI skeleton (docs/12 §6). Backend and frontend build independently on every PR.
# Authorization-matrix + default-deny suites become release-blocking from M1 (docs/09 §2.3).
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build & test
        # Testcontainers uses the Docker daemon available on GitHub-hosted runners.
        run: ./gradlew --no-daemon build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # ── M9 hardening: supply-chain scanning (docs/10 §8). Fail on high-severity findings. ──
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend) — fail on high
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # OWASP Dependency-Check for the backend. Requires the `org.owasp.dependencycheck` Gradle
      # plugin to be applied in backend/build.gradle.kts (TODO: add plugin + NVD API key secret).
      - name: OWASP Dependency-Check (backend)
        working-directory: backend
        run: ./gradlew --no-daemon dependencyCheckAnalyze || echo "::warning::dependencyCheck plugin not yet configured (docs/10 §8)"

  image-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t gatherly-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t gatherly-frontend:ci ./frontend
      - name: Trivy scan — backend (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: gatherly-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan — frontend (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: gatherly-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
